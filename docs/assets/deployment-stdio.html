<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AMS — local stdio deployment</title>
<style>
  body {
    margin: 0;
    padding: 24px;
    background: #ffffff;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #1e293b;
  }
  .canvas { width: 1120px; margin: 0 auto; }
  svg { display: block; width: 100%; height: auto; }
  svg .panel      { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
  svg .box-ams    { fill: #eef2ff; stroke: #6366f1; stroke-width: 2; }
  svg .box-qmd    { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
  svg .box-client { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; }
  svg .store      { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
  svg .edge       { stroke: #475569; stroke-width: 1.8; fill: none; }
  svg .ptitle     { font-size: 13px; fill: #475569; font-weight: 700; letter-spacing: 1.5px; }
  svg .lbl        { font-size: 14.5px; fill: #1e293b; font-weight: 600; }
  svg .sub        { font-size: 11.5px; fill: #64748b; }
  svg .env        { font-size: 12.5px; fill: #334155; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  svg .flow       { font-size: 12px; fill: #475569; }
  svg .ann        { font-size: 11px; fill: #94a3b8; font-style: italic; }
  /* White halo so edge labels can sit on top of their own lines cleanly. */
  svg .flow, svg .ann {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 5px;
    stroke-linejoin: round;
  }
  svg .badge-rect { fill: #e0e7ff; stroke: #6366f1; stroke-width: 1; }
  svg .badge-txt  { font-size: 11px; fill: #4338ca; font-weight: 600; }
</style>
</head>
<body>
<div class="canvas">
  <svg viewBox="0 0 1120 570" role="img" aria-label="AMS local stdio deployment: agent host with stdio MCP server talking to the vault host">
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
      </marker>
    </defs>

    <!-- AGENT HOST panel -->
    <rect x="30" y="60" width="420" height="440" rx="10" class="panel"/>
    <text x="50" y="88" class="ptitle">AGENT HOST</text>

    <rect x="110" y="120" width="260" height="76" rx="8" class="box-client"/>
    <text x="240" y="152" text-anchor="middle" class="lbl">AI agent</text>
    <text x="240" y="174" text-anchor="middle" class="sub">opencode / openclaw / …</text>

    <line x1="240" y1="196" x2="240" y2="254" class="edge" marker-end="url(#arr)"/>
    <text x="252" y="230" class="ann">spawns</text>

    <rect x="110" y="260" width="260" height="150" rx="8" class="box-ams"/>
    <rect x="288" y="272" width="60" height="24" rx="12" class="badge-rect"/>
    <text x="318" y="288" text-anchor="middle" class="badge-txt">stdio</text>
    <text x="240" y="308" text-anchor="middle" class="lbl">AMS MCP server</text>
    <text x="140" y="332" class="env">AMS_API_URL</text>
    <text x="140" y="352" class="env">AMS_QMD_URL</text>
    <text x="140" y="390" class="sub" font-style="italic">no auth — same-host use only</text>

    <!-- VAULT HOST panel -->
    <rect x="620" y="60" width="470" height="460" rx="10" class="panel"/>
    <text x="640" y="88" class="ptitle">VAULT HOST</text>

    <rect x="650" y="110" width="170" height="64" rx="8" class="box-ams"/>
    <text x="735" y="136" text-anchor="middle" class="lbl">AMS API server</text>
    <text x="735" y="156" text-anchor="middle" class="sub">:3000</text>

    <rect x="890" y="110" width="180" height="64" rx="8" class="box-qmd"/>
    <text x="980" y="136" text-anchor="middle" class="lbl">QMD daemon</text>
    <text x="980" y="156" text-anchor="middle" class="sub">:8181</text>

    <line x1="822" y1="142" x2="886" y2="142" class="edge" marker-end="url(#arr)"/>
    <text x="855" y="188" text-anchor="middle" class="flow">update index</text>
    <text x="855" y="205" text-anchor="middle" class="flow" font-size="11px">qmd update + embed</text>

    <!-- vault cylinder -->
    <path d="M 870 385 A 95 18 0 0 0 1060 385 L 1060 485 A 95 18 0 0 1 870 485 Z" class="store"/>
    <ellipse cx="965" cy="385" rx="95" ry="18" class="store" fill="#fde68a"/>
    <text x="965" y="418" text-anchor="middle" class="lbl">vault</text>
    <text x="965" y="440" text-anchor="middle" class="env" font-size="12px">/tasks/todo.md</text>
    <text x="965" y="460" text-anchor="middle" class="env" font-size="12px">/arch/clean-code.md</text>

    <!-- cross-host arrows -->
    <line x1="370" y1="300" x2="646" y2="126" class="edge" marker-end="url(#arr)"/>
    <text x="500" y="190" text-anchor="middle" class="flow">write MCP tools</text>

    <line x1="370" y1="365" x2="886" y2="150" class="edge" marker-end="url(#arr)"/>
    <text x="610" y="248" text-anchor="middle" class="flow">query MCP tools</text>

    <text x="535" y="432" text-anchor="middle" class="ann">cross-host HTTP</text>

    <!-- vault host internal arrows -->
    <line x1="737" y1="176" x2="897" y2="369" class="edge" marker-end="url(#arr)"/>
    <text x="790" y="272" text-anchor="middle" class="flow">writes</text>

    <line x1="965" y1="176" x2="965" y2="361" class="edge" marker-end="url(#arr)"/>
    <text x="978" y="272" class="flow">indexes</text>
  </svg>
</div>
</body>
</html>
