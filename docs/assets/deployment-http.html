<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AMS — remote HTTP deployment</title>
<style>
  body {
    margin: 0;
    padding: 24px;
    background: #ffffff;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #1e293b;
  }
  .canvas { width: 1120px; margin: 0 auto; }
  svg { display: block; width: 100%; height: auto; }
  svg .panel      { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
  svg .box-ams    { fill: #eef2ff; stroke: #6366f1; stroke-width: 2; }
  svg .box-qmd    { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
  svg .box-ext    { fill: #fdf2f8; stroke: #db2777; stroke-width: 2; }
  svg .store      { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
  svg .edge       { stroke: #475569; stroke-width: 1.8; fill: none; }
  svg .edge-dash  { stroke: #db2777; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; }
  svg .ptitle     { font-size: 13px; fill: #475569; font-weight: 700; letter-spacing: 1.5px; }
  svg .lbl        { font-size: 14.5px; fill: #1e293b; font-weight: 600; }
  svg .sub        { font-size: 11.5px; fill: #64748b; }
  svg .env        { font-size: 12.5px; fill: #334155; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  svg .flow       { font-size: 12px; fill: #475569; }
  svg .ann        { font-size: 11px; fill: #94a3b8; font-style: italic; }
  svg .badge-rect { fill: #e0e7ff; stroke: #6366f1; stroke-width: 1; }
  svg .badge-txt  { font-size: 11px; fill: #4338ca; font-weight: 600; }
</style>
</head>
<body>
<div class="canvas">
  <svg viewBox="0 0 1120 660" role="img" aria-label="AMS remote HTTP deployment: external agent with OAuth talking to the vault host MCP server">
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
      </marker>
      <marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#db2777"/>
      </marker>
    </defs>

    <!-- EXTERNAL HOST panel -->
    <rect x="30" y="60" width="330" height="300" rx="10" class="panel"/>
    <text x="50" y="88" class="ptitle">EXTERNAL HOST</text>

    <rect x="70" y="110" width="250" height="90" rx="8" class="box-ext"/>
    <text x="195" y="146" text-anchor="middle" class="lbl">AI agent</text>
    <text x="195" y="166" text-anchor="middle" class="sub">proprietary app</text>
    <text x="195" y="184" text-anchor="middle" class="sub">Claude / ChatGPT / …</text>

    <line x1="225" y1="200" x2="225" y2="246" class="edge" marker-end="url(#arr)"/>
    <text x="237" y="228" class="ann">MCP client</text>

    <rect x="130" y="250" width="190" height="64" rx="8" class="box-ext"/>
    <text x="225" y="276" text-anchor="middle" class="lbl">AMS connector</text>
    <text x="225" y="296" text-anchor="middle" class="sub">app integration</text>

    <!-- OAuth provider -->
    <rect x="70" y="430" width="250" height="90" rx="8" class="box-ext"/>
    <text x="195" y="468" text-anchor="middle" class="lbl">OAuth provider</text>
    <text x="195" y="490" text-anchor="middle" class="sub">Auth0 / any OIDC issuer</text>

    <line x1="70" y1="150" x2="120" y2="426" class="edge" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <text x="60" y="300" text-anchor="start" class="ann">authorization</text>
    <text x="60" y="316" text-anchor="start" class="ann">code flow</text>

    <line x1="322" y1="468" x2="638" y2="288" class="edge-dash" marker-end="url(#arrp)"/>
    <text x="470" y="398" text-anchor="middle" class="ann" fill="#db2777">JWKS validation</text>

    <!-- VAULT HOST panel -->
    <rect x="560" y="40" width="530" height="600" rx="10" class="panel"/>
    <text x="580" y="68" class="ptitle">VAULT HOST</text>

    <rect x="600" y="90" width="330" height="194" rx="8" class="box-ams"/>
    <rect x="770" y="102" width="130" height="24" rx="12" class="badge-rect"/>
    <text x="835" y="118" text-anchor="middle" class="badge-txt">Streamable HTTP</text>
    <text x="740" y="150" text-anchor="middle" class="lbl">AMS MCP server</text>
    <text x="740" y="170" text-anchor="middle" class="sub">:3111 · POST /mcp</text>
    <text x="630" y="198" class="env">AMS_MCP_TOKEN · required</text>
    <text x="630" y="218" class="env">AMS_MCP_OAUTH_ISSUER</text>
    <text x="630" y="238" class="env">AMS_MCP_OAUTH_AUDIENCE</text>
    <text x="630" y="258" class="env">AMS_MCP_PUBLIC_URL</text>
    <text x="630" y="278" class="sub" font-size="10.5px">OAuth 2.1 resource server — optional, all-or-none</text>

    <rect x="620" y="340" width="170" height="64" rx="8" class="box-ams"/>
    <text x="705" y="366" text-anchor="middle" class="lbl">AMS API server</text>
    <text x="705" y="386" text-anchor="middle" class="sub">:3000</text>

    <rect x="880" y="340" width="180" height="64" rx="8" class="box-qmd"/>
    <text x="970" y="366" text-anchor="middle" class="lbl">QMD daemon</text>
    <text x="970" y="386" text-anchor="middle" class="sub">:8181</text>

    <line x1="792" y1="372" x2="876" y2="372" class="edge" marker-end="url(#arr)"/>
    <text x="834" y="414" text-anchor="middle" class="flow">update index</text>
    <text x="834" y="430" text-anchor="middle" class="flow" font-size="11px">qmd update + embed</text>

    <!-- vault cylinder -->
    <path d="M 870 510 A 95 18 0 0 0 1060 510 L 1060 600 A 95 18 0 0 0 870 600 Z" class="store"/>
    <ellipse cx="965" cy="510" rx="95" ry="18" class="store" fill="#fde68a"/>
    <text x="965" y="545" text-anchor="middle" class="lbl">vault</text>
    <text x="965" y="568" text-anchor="middle" class="env" font-size="12px">/tasks/todo.md</text>
    <text x="965" y="588" text-anchor="middle" class="env" font-size="12px">/arch/clean-code.md</text>

    <!-- external to MCP -->
    <line x1="322" y1="282" x2="596" y2="160" class="edge" marker-end="url(#arr)"/>
    <text x="458" y="208" text-anchor="middle" class="flow">Bearer JWT (or static token)</text>

    <!-- MCP to API / QMD -->
    <line x1="660" y1="284" x2="700" y2="336" class="edge" marker-end="url(#arr)"/>
    <text x="668" y="314" text-anchor="end" class="flow">write MCP tools</text>

    <line x1="880" y1="284" x2="955" y2="336" class="edge" marker-end="url(#arr)"/>
    <text x="900" y="314" text-anchor="start" class="flow">query MCP tools</text>

    <!-- to vault -->
    <line x1="705" y1="404" x2="895" y2="494" class="edge" marker-end="url(#arr)"/>
    <text x="760" y="458" text-anchor="middle" class="flow">writes</text>

    <line x1="965" y1="404" x2="965" y2="488" class="edge" marker-end="url(#arr)"/>
    <text x="978" y="450" class="flow">indexes</text>
  </svg>
</div>
</body>
</html>
