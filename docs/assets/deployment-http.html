<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AMS — remote HTTP deployment</title>
<style>
  body {
    margin: 0;
    padding: 24px;
    background: #ffffff;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #1e293b;
  }
  .canvas { width: 1120px; margin: 0 auto; }
  svg { display: block; width: 100%; height: auto; }
  svg .panel      { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
  svg .box-ams    { fill: #eef2ff; stroke: #6366f1; stroke-width: 2; }
  svg .box-qmd    { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
  svg .box-ext    { fill: #fdf2f8; stroke: #db2777; stroke-width: 2; }
  svg .store      { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
  svg .edge       { stroke: #475569; stroke-width: 1.8; fill: none; }
  svg .edge-dash  { stroke: #db2777; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; }
  svg .ptitle     { font-size: 13px; fill: #475569; font-weight: 700; letter-spacing: 1.5px; }
  svg .lbl        { font-size: 14.5px; fill: #1e293b; font-weight: 600; }
  svg .sub        { font-size: 11.5px; fill: #64748b; }
  svg .env        { font-size: 12.5px; fill: #334155; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  svg .flow       { font-size: 12px; fill: #475569; }
  svg .ann        { font-size: 11px; fill: #94a3b8; font-style: italic; }
  /* White halo so edge labels can sit on top of their own lines cleanly. */
  svg .flow, svg .ann {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 5px;
    stroke-linejoin: round;
  }
  svg .badge-rect { fill: #e0e7ff; stroke: #6366f1; stroke-width: 1; }
  svg .badge-txt  { font-size: 11px; fill: #4338ca; font-weight: 600; }
</style>
</head>
<body>
<div class="canvas">
  <svg viewBox="0 0 1120 700" role="img" aria-label="AMS remote HTTP deployment: external agent with OAuth talking to the vault host MCP server">
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
      </marker>
      <marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#db2777"/>
      </marker>
    </defs>

    <!-- EXTERNAL HOST panel -->
    <rect x="30" y="70" width="340" height="310" rx="10" class="panel"/>
    <text x="50" y="98" class="ptitle">EXTERNAL HOST</text>

    <rect x="70" y="120" width="260" height="100" rx="8" class="box-ext"/>
    <text x="200" y="158" text-anchor="middle" class="lbl">AI agent</text>
    <text x="200" y="178" text-anchor="middle" class="sub">proprietary app</text>
    <text x="200" y="196" text-anchor="middle" class="sub">Claude / ChatGPT / …</text>

    <line x1="200" y1="224" x2="200" y2="270" class="edge" marker-end="url(#arr)"/>
    <text x="214" y="252" class="ann">MCP client</text>

    <rect x="105" y="274" width="200" height="64" rx="8" class="box-ext"/>
    <text x="205" y="300" text-anchor="middle" class="lbl">AMS connector</text>
    <text x="205" y="320" text-anchor="middle" class="sub">app integration</text>

    <!-- OAuth provider -->
    <rect x="60" y="470" width="260" height="90" rx="8" class="box-ext"/>
    <text x="190" y="508" text-anchor="middle" class="lbl">OAuth provider</text>
    <text x="190" y="530" text-anchor="middle" class="sub">Auth0 / any OIDC issuer</text>

    <!-- external host <-> OAuth provider -->
    <line x1="190" y1="384" x2="190" y2="464" class="edge" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <text x="178" y="430" text-anchor="end" class="ann">authorization code flow</text>

    <!-- OAuth provider -> MCP (JWKS) -->
    <line x1="322" y1="515" x2="640" y2="294" class="edge-dash" marker-end="url(#arrp)"/>
    <text x="480" y="405" text-anchor="middle" class="ann" fill="#db2777">JWKS validation</text>

    <!-- VAULT HOST panel -->
    <rect x="560" y="40" width="530" height="620" rx="10" class="panel"/>
    <text x="580" y="68" class="ptitle">VAULT HOST</text>

    <rect x="600" y="90" width="330" height="200" rx="8" class="box-ams"/>
    <rect x="770" y="102" width="130" height="24" rx="12" class="badge-rect"/>
    <text x="835" y="118" text-anchor="middle" class="badge-txt">Streamable HTTP</text>
    <text x="765" y="152" text-anchor="middle" class="lbl">AMS MCP server</text>
    <text x="765" y="172" text-anchor="middle" class="sub">:3111 · POST /mcp</text>
    <text x="630" y="200" class="env">AMS_MCP_TOKEN · required</text>
    <text x="630" y="220" class="env">AMS_MCP_OAUTH_ISSUER</text>
    <text x="630" y="240" class="env">AMS_MCP_OAUTH_AUDIENCE</text>
    <text x="630" y="260" class="env">AMS_MCP_PUBLIC_URL</text>
    <text x="630" y="280" class="sub" font-size="10.5px">OAuth 2.1 resource server — optional, all-or-none</text>

    <rect x="620" y="360" width="170" height="64" rx="8" class="box-ams"/>
    <text x="695" y="386" text-anchor="middle" class="lbl">AMS API server</text>
    <text x="695" y="406" text-anchor="middle" class="sub">:3000</text>

    <rect x="880" y="360" width="180" height="64" rx="8" class="box-qmd"/>
    <text x="970" y="386" text-anchor="middle" class="lbl">QMD daemon</text>
    <text x="970" y="406" text-anchor="middle" class="sub">:8181</text>

    <line x1="792" y1="392" x2="876" y2="392" class="edge" marker-end="url(#arr)"/>
    <text x="834" y="414" text-anchor="middle" class="flow" font-size="11px">update index</text>
    <text x="834" y="431" text-anchor="middle" class="flow" font-size="11px">qmd update + embed</text>

    <!-- vault cylinder -->
    <path d="M 870 520 A 95 18 0 0 0 1060 520 L 1060 610 A 95 18 0 0 1 870 610 Z" class="store"/>
    <ellipse cx="965" cy="520" rx="95" ry="18" class="store" fill="#fde68a"/>
    <text x="965" y="555" text-anchor="middle" class="lbl">vault</text>
    <text x="965" y="578" text-anchor="middle" class="env" font-size="12px">/tasks/todo.md</text>
    <text x="965" y="598" text-anchor="middle" class="env" font-size="12px">/arch/clean-code.md</text>

    <!-- external connector to MCP -->
    <line x1="307" y1="306" x2="596" y2="172" class="edge" marker-end="url(#arr)"/>
    <text x="465" y="232" text-anchor="middle" class="flow" font-size="11px">Bearer JWT (or static token)</text>

    <!-- MCP to API / QMD -->
    <line x1="660" y1="294" x2="698" y2="354" class="edge" marker-end="url(#arr)"/>
    <text x="679" y="328" text-anchor="middle" class="flow">write MCP tools</text>

    <line x1="880" y1="294" x2="955" y2="354" class="edge" marker-end="url(#arr)"/>
    <text x="917" y="328" text-anchor="middle" class="flow">query MCP tools</text>

    <!-- to vault -->
    <line x1="705" y1="426" x2="895" y2="506" class="edge" marker-end="url(#arr)"/>
    <text x="800" y="470" text-anchor="middle" class="flow">writes</text>

    <line x1="965" y1="426" x2="965" y2="498" class="edge" marker-end="url(#arr)"/>
    <text x="978" y="466" class="flow">indexes</text>
  </svg>
</div>
</body>
</html>
