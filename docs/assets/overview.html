<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AMS — overview</title>
<style>
  body {
    margin: 0;
    padding: 24px;
    background: #ffffff;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #1e293b;
  }
  .canvas { width: 1120px; margin: 0 auto; }
  svg { display: block; width: 100%; height: auto; }
  .caption {
    margin: 14px 4px 0;
    font-size: 14px;
    color: #64748b;
    text-align: center;
  }
  svg .box-client { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; }
  svg .box-ams    { fill: #eef2ff; stroke: #6366f1; stroke-width: 2; }
  svg .box-qmd    { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
  svg .store      { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
  svg .edge       { stroke: #475569; stroke-width: 1.8; fill: none; }
  svg .edge-dash  { stroke: #94a3b8; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; }
  svg .lbl        { font-size: 14px;  fill: #1e293b; font-weight: 600; }
  svg .sub        { font-size: 11.5px; fill: #64748b; }
  svg .flow       { font-size: 12px;  fill: #475569; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  svg .ann        { font-size: 11px;  fill: #94a3b8; font-style: italic; }
  /* White halo so edge labels can sit on top of their own lines cleanly. */
  svg .flow, svg .ann {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 5px;
    stroke-linejoin: round;
  }
</style>
</head>
<body>
<div class="canvas">
  <svg viewBox="0 0 1120 360" role="img" aria-label="AMS overview: agent, MCP server, write and read paths, vault and index">
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
      </marker>
    </defs>

    <!-- AI agent -->
    <rect x="40" y="130" width="150" height="70" rx="8" class="box-client"/>
    <text x="115" y="160" text-anchor="middle" class="lbl">AI agent</text>
    <text x="115" y="180" text-anchor="middle" class="sub">any MCP client</text>

    <!-- AMS MCP server -->
    <rect x="270" y="115" width="190" height="90" rx="8" class="box-ams"/>
    <text x="365" y="152" text-anchor="middle" class="lbl">AMS MCP server</text>
    <text x="365" y="172" text-anchor="middle" class="sub">six domain tools</text>

    <!-- Write API -->
    <rect x="600" y="45" width="170" height="64" rx="8" class="box-ams"/>
    <text x="685" y="72" text-anchor="middle" class="lbl">Write API</text>
    <text x="685" y="92" text-anchor="middle" class="sub">validated writes</text>

    <!-- QMD search -->
    <rect x="600" y="225" width="170" height="64" rx="8" class="box-qmd"/>
    <text x="685" y="252" text-anchor="middle" class="lbl">QMD search</text>
    <text x="685" y="272" text-anchor="middle" class="sub">hybrid lexical + vector</text>

    <!-- Markdown vault cylinder -->
    <path d="M 850 48 A 95 18 0 0 0 1040 48 L 1040 128 A 95 18 0 0 1 850 128 Z" class="store"/>
    <ellipse cx="945" cy="48" rx="95" ry="18" class="store" fill="#fde68a"/>
    <text x="945" y="88" text-anchor="middle" class="lbl">Markdown vault</text>
    <text x="945" y="108" text-anchor="middle" class="sub">plain .md files you own</text>

    <!-- QMD index cylinder -->
    <path d="M 850 228 A 95 18 0 0 0 1040 228 L 1040 308 A 95 18 0 0 1 850 308 Z" class="store"/>
    <ellipse cx="945" cy="228" rx="95" ry="18" class="store" fill="#fde68a"/>
    <text x="945" y="268" text-anchor="middle" class="lbl">QMD index</text>
    <text x="945" y="288" text-anchor="middle" class="sub">local, rebuildable</text>

    <!-- flows -->
    <line x1="190" y1="165" x2="262" y2="161" class="edge" marker-end="url(#arr)"/>

    <line x1="460" y1="140" x2="596" y2="80" class="edge" marker-end="url(#arr)"/>
    <text x="530" y="168" text-anchor="middle" class="flow">record_note · delete_note</text>
    <text x="530" y="185" text-anchor="middle" class="flow">list_types · list_tags</text>

    <line x1="460" y1="185" x2="596" y2="250" class="edge" marker-end="url(#arr)"/>
    <text x="530" y="243" text-anchor="middle" class="flow">search_memory · get_memory</text>

    <line x1="770" y1="77" x2="846" y2="62" class="edge" marker-end="url(#arr)"/>
    <text x="800" y="55" text-anchor="middle" class="ann">writes</text>

    <line x1="770" y1="257" x2="846" y2="245" class="edge" marker-end="url(#arr)"/>
    <text x="800" y="280" text-anchor="middle" class="ann">searches</text>

    <line x1="945" y1="152" x2="945" y2="222" class="edge-dash" marker-end="url(#arr)"/>
    <text x="958" y="184" text-anchor="start" class="ann">indexed from your files</text>
  </svg>
  <p class="caption">The agent reads its memories back in any future session.</p>
</div>
</body>
</html>
